<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: black;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: Arial, sans-serif;
}

#kalp {
    font-size: 120px;
    cursor: pointer;
}

#yazi {
    display: none;
    font-size: 28px;
    cursor: pointer;
    padding: 30px;
}

#kalp:active {
    transform: scale(1.3);
}
</style>
</head>

<body>

<div id="kalp" onclick="kalbeBas()">❤️</div>

<div id="yazi" onclick="yaziyaBas()">
    Sana söylemek istediğim bir şey var ❤️
</div>

<script>

function kalbeBas() {
    document.getElementById("kalp").style.display = "none";
    document.getElementById("yazi").style.display = "block";
}

function yaziyaBas() {
    document.getElementById("yazi").innerHTML =
    "Her şey bir kalple başladı ❤️";
}

</script>

</body>
</html>
